services:
  redis:
    image: redis:alpine
    container_name: agriculture-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: agriculture-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Your_strong_Password123}"
    ports:
      - "1433:1433"
    volumes:
      - agriculture_sql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: agriculture-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-admin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minio-admin-password}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - agriculture_minio_data:/data

  minio-setup:
    image: minio/mc:latest
    container_name: agriculture-minio-setup
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-admin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minio-admin-password}"
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER:-admin} $${MINIO_ROOT_PASSWORD:-minio-admin-password};
      /usr/bin/mc mb myminio/tarim-uploads || true;
      /usr/bin/mc anonymous set none myminio/tarim-uploads || true;
      exit 0;
      "

  seq:
    image: datalust/seq:latest
    container_name: agriculture-seq
    environment:
      ACCEPT_EULA: Y
    ports:
      - "5341:80"
    volumes:
      - agriculture_seq_data:/data

  tarim-api:
    build:
      context: .
      dockerfile: src/Hosts/Agriculture.Api/Dockerfile
    container_name: agriculture-api
    ports:
      - "5109:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AgricultureDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Your_strong_Password123};TrustServerCertificate=True;MultipleActiveResultSets=true"
      ConnectionStrings__Redis: redis:6379
      Database__ApplyMigrationsOnStartup: "true"
      Database__SeedDemoData: "true"
      Minio__Enabled: "true"
      Minio__Endpoint: minio:9000
      Minio__AccessKey: "${MINIO_ROOT_USER:-admin}"
      Minio__SecretKey: "${MINIO_ROOT_PASSWORD:-minio-admin-password}"
      WebPush__Subject: "${WEB_PUSH_SUBJECT:-mailto:admin@agriculture.local}"
      WebPush__PublicKey: "${WEB_PUSH_PUBLIC_KEY:-}"
      WebPush__PrivateKey: "${WEB_PUSH_PRIVATE_KEY:-}"
    depends_on:
      sqlserver:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
      redis:
        condition: service_started

  tarim-ai:
    build:
      context: ./tarim_ai
      dockerfile: Dockerfile
    container_name: agriculture-ai
    ports:
      - "4000:4000"
    environment:
      ANALYSIS_DATA_MODE: golden
      COPERNICUS_CLIENT_ID: golden-mode
      COPERNICUS_CLIENT_SECRET: golden-mode

  tarim-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agriculture-frontend
    ports:
      - "5173:8080"
    depends_on:
      - tarim-api
      - tarim-ai

volumes:
  agriculture_sql_data:
  agriculture_minio_data:
  agriculture_seq_data:
