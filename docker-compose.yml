services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: agriculture-sql
    env_file:
      - .env
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - agriculture_sql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: agriculture-minio
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - agriculture_minio_data:/data

  tarim-api:
    build:
      context: .
      dockerfile: src/Hosts/Agriculture.Api/Dockerfile
    container_name: agriculture-api
    ports:
      - "5109:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - sqlserver
      - minio

  tarim-ai:
    build:
      context: ./tarim_ai
      dockerfile: Dockerfile
    container_name: agriculture-ai
    ports:
      - "4000:4000"

  tarim-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agriculture-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5109
      - VITE_TARIM_AI_PROXY_TARGET=http://tarim-ai:4000
    depends_on:
      - tarim-api
      - tarim-ai

volumes:
  agriculture_sql_data:
  agriculture_minio_data:
