<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Ekim uygulaması adımları</title>
  <desc id="description">Toprak kontrolü, sıra açma, tohumu uygun derinliğe bırakma ve can suyu verme adımlarını gösteren eğitim görseli.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf6ed"/>
      <stop offset="1" stop-color="#fbf8eb"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5a36"/>
      <stop offset="1" stop-color="#5c3925"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#173c24" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="700" rx="38" fill="url(#sky)"/>
  <circle cx="1030" cy="105" r="54" fill="#f5ca62" opacity=".9"/>
  <path d="M0 425 C220 365 330 430 520 390 C750 340 940 390 1200 320 L1200 700 L0 700Z" fill="url(#soil)"/>
  <path d="M0 505 C250 440 430 520 650 450 C870 385 1040 430 1200 395" fill="none" stroke="#b78a5a" stroke-width="24" opacity=".55"/>
  <path d="M0 590 C260 510 460 600 710 520 C910 460 1070 500 1200 468" fill="none" stroke="#c79a66" stroke-width="20" opacity=".5"/>
  <g transform="translate(112 92)" filter="url(#shadow)">
    <rect width="976" height="250" rx="28" fill="#fff" fill-opacity=".94"/>
    <text x="44" y="58" fill="#1b5e20" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">UZMAN REHBERİ</text>
    <text x="44" y="112" fill="#173622" font-family="Arial, sans-serif" font-size="40" font-weight="800">Ekim uygulaması</text>
    <text x="44" y="151" fill="#607267" font-family="Arial, sans-serif" font-size="20">İşleme başlamadan önce dört kontrolü tamamla.</text>
    <g transform="translate(44 181)" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#294a32">
      <circle cx="18" cy="18" r="18" fill="#dff0e2"/><text x="13" y="24">1</text><text x="48" y="24">Toprağın tavını kontrol et</text>
      <circle cx="286" cy="18" r="18" fill="#dff0e2"/><text x="281" y="24">2</text><text x="316" y="24">Sıraları düzgün aç</text>
      <circle cx="530" cy="18" r="18" fill="#dff0e2"/><text x="525" y="24">3</text><text x="560" y="24">Derinliği eşit tut</text>
      <circle cx="762" cy="18" r="18" fill="#dff0e2"/><text x="757" y="24">4</text><text x="792" y="24">Can suyunu ver</text>
    </g>
  </g>
  <g transform="translate(475 380)">
    <path d="M100 190 C74 150 83 99 112 69 C140 98 152 148 126 190Z" fill="#55a861"/>
    <path d="M112 190 L112 82" stroke="#2d7d3c" stroke-width="10" stroke-linecap="round"/>
    <path d="M111 128 C65 132 42 107 38 74 C77 70 104 91 111 128Z" fill="#69b974"/>
    <path d="M114 110 C151 104 178 78 183 47 C146 43 119 70 114 110Z" fill="#4c9d59"/>
    <ellipse cx="112" cy="216" rx="84" ry="25" fill="#42271c" opacity=".45"/>
    <path d="M112 195 C89 210 82 229 73 252 M112 195 C133 211 142 230 153 250 M112 201 L112 260" stroke="#e6d5af" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g fill="#ead7ad">
    <ellipse cx="245" cy="470" rx="12" ry="8" transform="rotate(-24 245 470)"/>
    <ellipse cx="310" cy="520" rx="12" ry="8" transform="rotate(18 310 520)"/>
    <ellipse cx="890" cy="445" rx="12" ry="8" transform="rotate(-16 890 445)"/>
    <ellipse cx="962" cy="525" rx="12" ry="8" transform="rotate(24 962 525)"/>
  </g>
</svg>
