map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    client_max_body_size 20m;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz { access_log off; return 200 'healthy'; add_header Content-Type text/plain; include /etc/nginx/snippets/security-headers.conf; }
    location = /health/live { proxy_pass http://tarim-api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto; }
    location = /health/ready { proxy_pass http://tarim-api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto; }
    location /api/ { proxy_pass http://tarim-api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /hubs/ { proxy_pass http://tarim-api:8080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; }
    location /tarim-ai-api/ { proxy_pass http://tarim-ai:4000/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location ^~ /swagger { return 404; }

    location = /sw.js { add_header Cache-Control "no-cache, no-store, must-revalidate"; include /etc/nginx/snippets/security-headers.conf; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; include /etc/nginx/snippets/security-headers.conf; try_files $uri =404; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; include /etc/nginx/snippets/security-headers.conf; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; include /etc/nginx/snippets/security-headers.conf; }
}
