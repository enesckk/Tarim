name: Tarım CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test-dotnet:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
        
    - name: Restore dependencies
      run: dotnet restore Agriculture.sln

    - name: Restore repository tools
      run: dotnet tool restore
      
    - name: Build backend
      run: dotnet build Agriculture.sln --no-restore --configuration Release

    - name: Run backend tests
      run: dotnet test Agriculture.sln --no-build --configuration Release

    - name: Verify Agriculture migrations match the model
      run: dotnet ef migrations has-pending-model-changes --project src/BuildingBlocks/Agriculture.Infrastructure --startup-project src/Hosts/Agriculture.Api --context AgricultureDbContext --no-build --configuration Release

    - name: Verify Identity migrations match the model
      run: dotnet ef migrations has-pending-model-changes --project src/Modules/Identity/Agriculture.Modules.Identity.Infrastructure --startup-project src/Hosts/Agriculture.Api --context IdentityDbContext --no-build --configuration Release
      
  build-and-test-tarim-ai:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./tarim_ai
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: npm ci

    - name: Audit all Tarim AI dependencies
      run: npm audit --audit-level=high

    - name: Test Tarım AI
      run: npm test
      
    - name: Build Tarım AI
      run: npm run build

  build-pwa:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Audit all PWA dependencies
      run: npm audit --audit-level=high

    - name: Lint PWA
      run: npm run lint

    - name: Build PWA
      run: npm run build

  build-container-images:
    runs-on: ubuntu-latest
    needs: [build-and-test-dotnet, build-and-test-tarim-ai, build-pwa]

    steps:
    - uses: actions/checkout@v4

    - name: Build API image
      run: docker build --tag agriculture-api:${{ github.sha }} --file src/Hosts/Agriculture.Api/Dockerfile .

    - name: Build Tarim AI runtime image
      run: docker build --tag agriculture-tarim-ai:${{ github.sha }} --file tarim_ai/Dockerfile tarim_ai

    - name: Build frontend image
      run: docker build --tag agriculture-frontend:${{ github.sha }} --file frontend/Dockerfile frontend
