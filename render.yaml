services:
  - type: pserv
    name: tarim-sqlserver
    runtime: image
    plan: starter
    region: frankfurt
    image:
      url: mcr.microsoft.com/mssql/server:2022-latest
    envVars:
      - key: ACCEPT_EULA
        value: "Y"
      - key: MSSQL_PID
        value: Express
      - key: MSSQL_SA_PASSWORD
        sync: false
    disk:
      name: tarim-sqlserver-data
      mountPath: /var/opt/mssql
      sizeGB: 10

  - type: keyvalue
    name: tarim-redis
    plan: starter
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: pserv
    name: tarim-ai
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./tarim_ai/Dockerfile
    dockerContext: ./tarim_ai
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: ANALYSIS_DATA_MODE
        value: live
      - key: COPERNICUS_CLIENT_ID
        sync: false
      - key: COPERNICUS_CLIENT_SECRET
        sync: false
      - key: PARCEL_PROVIDER
        value: tkgm
      - key: CLIMATE_PROVIDER
        value: nasa-power
      - key: SOIL_PROVIDER
        value: soilgrids
      - key: TERRAIN_PROVIDER
        value: copernicus-dem
      - key: TERRAIN_DEM_ENABLED
        value: "true"
      - key: DATABASE_ENABLED
        value: "true"
      - key: PERSISTENCE_PROVIDER
        value: postgresql
      - key: DATABASE_AUTO_MIGRATE
        value: "true"
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: tarim-ai-postgres
          property: connectionString
      - key: AMS_BASE_URL
        value: http://tarim-api:8080
      - key: AMS_INTEGRATION_API_KEY
        sync: false
      - key: WEEKLY_ANALYSIS_ENABLED
        value: "false"
    disk:
      name: tarim-ai-storage
      mountPath: /app/storage
      sizeGB: 5

  - type: web
    name: tarim-api
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./src/Hosts/Agriculture.Api/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: ConnectionStrings__Redis
        fromService:
          type: keyvalue
          name: tarim-redis
          property: connectionString
      - key: Database__ApplyMigrationsOnStartup
        value: "true"
      - key: Database__SeedDemoData
        value: "false"
      - key: Database__SeedVerifiedParcelData
        value: "false"
      - key: BootstrapAdmin__Enabled
        value: "true"
      - key: BootstrapAdmin__Email
        sync: false
      - key: BootstrapAdmin__Password
        sync: false
      - key: BootstrapAdmin__FirstName
        value: Sistem
      - key: BootstrapAdmin__LastName
        value: Yöneticisi
      - key: Jwt__Secret
        sync: false
      - key: ReverseProxy__TrustForwardedHeaders
        value: "true"
      - key: ReverseProxy__ForwardLimit
        value: "1"
      - key: Cors__Origins__0
        value: https://tarim-two.vercel.app
      - key: Minio__Enabled
        value: "false"
      - key: TarimAi__BaseUrl
        value: http://tarim-ai:4000
      - key: TarimAi__IntegrationApiKey
        fromService:
          type: pserv
          name: tarim-ai
          envVarKey: AMS_INTEGRATION_API_KEY
      - key: WebPush__Subject
        sync: false
      - key: WebPush__PublicKey
        sync: false
      - key: WebPush__PrivateKey
        sync: false
    disk:
      name: tarim-api-uploads
      mountPath: /app/wwwroot/uploads
      sizeGB: 5

databases:
  - name: tarim-ai-postgres
    plan: basic-256mb
    region: frankfurt
    databaseName: tarim_ai
    user: tarim
    postgresMajorVersion: "16"
    ipAllowList: []
